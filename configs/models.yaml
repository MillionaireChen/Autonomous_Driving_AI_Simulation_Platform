# Model registry (spec section 16).
#
# Any model reachable at a gRPC endpoint speaking the DrivingModel protocol can
# be listed here; the simulator needs nothing else to drive with it.
#
# gpu is advisory metadata for whoever launches the service - the simulator
# never places models on devices itself.

models:
  - id: dummy
    name: Dummy Constant Control
    type: CONTROL_POLICY
    endpoint: localhost:51001
    # Milliseconds before an inference counts as a timeout (spec section 50).
    timeout_ms: 500
    # Order in the dashboard's model list. Lower comes first, and the first
    # entry is what a fresh page has selected - so it should be a model that
    # can actually drive. Sorting by id put cnn_il first, which fails the
    # scenario, and made the default experience a crash.
    display_order: 30

  - id: pid
    name: PID Lane Follower
    type: CONTROL_POLICY
    endpoint: localhost:51002
    timeout_ms: 500
    display_order: 10

  - id: cnn_il
    name: CNN Imitation Learning
    type: CONTROL_POLICY
    endpoint: localhost:51003
    timeout_ms: 500
    # Inference runs on the same card as CARLA; both fit comfortably.
    gpu: 0
    display_order: 20
