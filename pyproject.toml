[project]
name = "autonomous-driving-ai-arena"
version = "0.1.0"
description = "A GPU-accelerated closed-loop simulation platform for testing autonomous driving models against interactive traffic scenarios using CARLA."
readme = "README.md"
# The CARLA wheel is published for cp310/cp311/cp312 as manylinux_2_31.
# This host is Ubuntu 20.04 (glibc 2.31), so 3.11 is the verified match.
requires-python = ">=3.11,<3.12"

dependencies = [
    "carla==0.9.16",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "grpcio>=1.83.0",
    "grpcio-tools>=1.83.0",
    "protobuf>=7.35.1",
    "pgserver>=0.1.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.3.4",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "alembic>=1.19.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=4.51",
    "peft>=0.20.0",
    "accelerate>=1.14.0",
    "qwen-vl-utils[decord]>=0.0.14",
]

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=8.0",
]

[tool.uv]
# The virtualenv lives on local disk (see .env.example); /home is a slow NFS mount.
package = false

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"

[tool.pytest.ini_options]
# The repo is not pip-installed, so tests import the packages from the tree.
pythonpath = ["."]
testpaths = ["tests"]
