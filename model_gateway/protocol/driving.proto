// The contract between the simulator and any driving model.
//
// A model implements this service and the simulator talks to it over gRPC
// (spec section 15). That is what lets a model live in another process, on
// another GPU, in another container or on another machine, without the
// simulation worker knowing the difference.
//
// All three policy types are implemented: a model answers Infer with pedals, a
// path, or a semantic decision, and the simulator executes whichever it gets.

syntax = "proto3";

package arena.v1;

service DrivingModel {
  // Liveness. Cheap and side-effect free.
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // Identity and, importantly, which sensors this model actually needs.
  rpc GetModelInfo(GetModelInfoRequest) returns (ModelInfo);

  // Start a new episode. Any per-episode state is cleared here.
  rpc ResetEpisode(ResetEpisodeRequest) returns (ResetEpisodeResponse);

  // One observation in, one action out.
  rpc Infer(InferRequest) returns (InferResponse);
}

enum ModelType {
  MODEL_TYPE_UNSPECIFIED = 0;
  CONTROL_POLICY = 1;
  TRAJECTORY_POLICY = 2;
  HIGH_LEVEL_POLICY = 3;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  bool healthy = 1;
  string detail = 2;
}

message GetModelInfoRequest {}

message ModelInfo {
  string id = 1;
  string name = 2;
  ModelType type = 3;
  // Sensor names this model consumes, e.g. "rgb_front", "speed". The gateway
  // sends only these, so a model that ignores camera data does not pay for
  // megabytes of pixels every tick.
  repeated string required_sensors = 4;
  string version = 5;
}

message ResetEpisodeRequest {
  string episode_id = 1;
  double fixed_delta_seconds = 2;
  double target_speed_mps = 3;
  int32 spawn_index = 4;
}

message ResetEpisodeResponse {
  bool ok = 1;
  string detail = 2;
}

message Pose {
  double x = 1;
  double y = 2;
  double z = 3;
  double roll = 4;
  double pitch = 5;
  double yaw = 6;
}

message Image {
  int32 width = 1;
  int32 height = 2;
  // "rgb8" for raw bytes, "jpeg" for encoded.
  string encoding = 3;
  bytes data = 4;
}

message Waypoint {
  double x = 1;
  double y = 2;
}

// Ground truth about the closest vehicle ahead. Privileged: only sent to a
// model that declares "lead_vehicle" in required_sensors.
message LeadVehicle {
  double gap_m = 1;
  double speed_mps = 2;
}

message Observation {
  int64 frame_id = 1;
  double timestamp = 2;
  double speed_mps = 3;
  double acceleration_mps2 = 4;
  double steering_angle = 5;
  Pose ego_pose = 6;
  Image rgb_front = 7;
  string route_command = 8;
  // Upcoming route points, nearest first. Sent when the model declares
  // "route": every real driving stack is given a route.
  repeated Waypoint route_waypoints = 9;
  LeadVehicle lead_vehicle = 10;
}

message VehicleControl {
  double throttle = 1;
  double steer = 2;
  double brake = 3;
  bool hand_brake = 4;
}

message InferRequest {
  Observation observation = 1;
}

// A point on a planned path, in the ego frame at the time of planning:
// forward is +x, right is +y, metres.
message TrajectoryPoint {
  double x = 1;
  double y = 2;
  double target_speed_mps = 3;
  double timestamp_s = 4;
}

message Trajectory {
  repeated TrajectoryPoint waypoints = 1;
}

// A semantic manoeuvre, executed by a controller in the simulator
// (spec section 14). This is what makes a large model viable as a driver: it
// answers in about 100 ms, which is fine for a decision and hopeless for
// steering at 20 Hz.
message Decision {
  // One of KEEP_LANE, SLOW_DOWN, BRAKE, CHANGE_LEFT, CHANGE_RIGHT. A word
  // outside that set is a rejected action, not undefined behaviour.
  string decision = 1;
  // Free text, recorded in the event log. A VLM can say why it braked, which
  // is most of the appeal of putting one here.
  string reason = 2;
  double confidence = 3;
}

message InferResponse {
  // A model answers with pedals or with a path, never both. Waypoint output is
  // what TCP, Transfuser, InterFuser and LAV all emit; the simulator's
  // trajectory controller turns it into control, so the model needs to know
  // nothing about this vehicle.
  oneof action {
    VehicleControl control = 1;
    Trajectory trajectory = 2;
    Decision decision = 3;
  }
}
